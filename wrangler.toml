name = "awangbotv3"
main = "src/index.js"
compatibility_date = "2024-01-01"

[vars]
ADMIN_ID = "5495392497"
# Tukar model Claude tanpa edit kod. Pilihan: claude-sonnet-5, claude-haiku-4-5, claude-opus-5
CLAUDE_MODEL = "claude-sonnet-5"
# Anak tangga fallback Cloudflare (dipisah comma), dari paling kuat ke paling murah.
# Semua dalam free tier 10,000 neuron/hari. ~500 request/hari pada rung pertama.
CF_MODEL_CHAIN = "@cf/qwen/qwen3-30b-a3b-fp8,@cf/openai/gpt-oss-20b,@cf/meta/llama-3.2-3b-instruct"

[[d1_databases]]
binding = "DB"
database_name = "awangbot78"
database_id = "fbb03f11-eaf8-4063-8d73-d7e377c9fc24"

[ai]
binding = "AI"
